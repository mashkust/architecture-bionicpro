services:
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./init/01_crm.sql:/docker-entrypoint-initdb.d/01_crm.sql
      - crm_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    volumes:
      - ./init/02_telemetry.sql:/docker-entrypoint-initdb.d/02_telemetry.sql
      - telemetry_pg_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.7.3-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_CONN_CRM_POSTGRES: postgresql://crm_user:crm_password@crm_db:5432/crm
      AIRFLOW_CONN_TELEMETRY_POSTGRES: postgresql://telemetry_user:telemetry_password@telemetry_db:5432/telemetry
    networks:
      - default
      - shared
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_metadata:/opt/airflow
    ports:
      - "8081:8080"
    depends_on:
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: >
      bash -c "
        pip install --quiet clickhouse-driver apache-airflow-providers-postgres &&
        airflow db init &&
        (airflow users create --username ${AIRFLOW_USERNAME:-admin} --password ${AIRFLOW_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
        (airflow webserver & airflow scheduler)
      "

volumes:
  crm_pg_data:
  telemetry_pg_data:
  clickhouse_data:
  airflow_metadata:

networks:
  shared:
    name: bionicpro_shared